import os
import lit.util
import lit.formats

# From libcxx lit: Tell pylint that we know config and lit_config exist somewhere.
if 'PYLINT_IMPORT' in os.environ:
    config = object()
    lit_config = object()

config.name = "SymbolRetrieverTest"

loaded_site_cfg = getattr(config, 'loaded_site_config', False)
if not loaded_site_cfg:
  # Check for 'site_config' user parameter, and use that if available.
  site_cfg = lit_config.params.get('site_config', None)
  if site_cfg and os.path.exists(site_cfg):
    lit_config.load_config(config, site_cfg)
    raise SystemExit

config.test_format = lit.formats.ShTest(execute_external=True)
config.suffixes = ['.cpp']

llvm_bin_dir = getattr(config, 'llvm_bin_dir', None)
build_dir = getattr(config, 'build_dir', None)
clang_cc = '{}/clang'.format(llvm_bin_dir)
clang_cxx = '{}/clang++'.format(llvm_bin_dir)
rt_lib_dir = '{}/test/symbol_retriever'.format(build_dir)
symbol_retriever_lib_dir = '{}/lib/symbol_retriever'.format(build_dir)
test_include_dir = getattr(config, 'test_include_dir', None)
test_flags = '-I{} -Wl,--whole-archive -L{} -lsymbol_retriever_test_rt -Wl,--no-whole-archive -L{} -lsymbol_retriever'.format(test_include_dir, rt_lib_dir, symbol_retriever_lib_dir)
extra_cxx_flags = getattr(config, 'extra_cxx_flags', None)

config.substitutions.append(('%clang_cc', clang_cc))
config.substitutions.append(('%clang_cxx', clang_cxx))
config.substitutions.append(('%test_flags', test_flags))
config.substitutions.append(('%extra_cxx_flags', extra_cxx_flags))



